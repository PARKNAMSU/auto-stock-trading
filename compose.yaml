name: auto-stock-trading

# 로컬 개발 전용: 인증 없이 실행하므로 호스트의 loopback에만 공개합니다.
services:
  mongodb:
    image: mongo:8.0.16
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  mongodb-test:
    image: mongo:8.0.16
    profiles: ["test"]
    ports:
      - "127.0.0.1:27018:27017"
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  mongodb-data:
